name: publish

# Trusted publishing via npm OIDC (no stored token, provenance attested).
# npmjs.com -> Add pending trusted publisher (works for a not-yet-existing
# package; the first publish through it creates the package):
#   Workflow: publish.yml  ·  Owner: lychee888  ·  Repo: galvanize-dsh
# NOTE: do NOT set setup-node registry-url here — it writes an empty
# _authToken that npm rejects on the OIDC path.
# After setup: push a `v*` tag and this workflow publishes.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - run: npx publint
      - run: npm publish --provenance --access public
